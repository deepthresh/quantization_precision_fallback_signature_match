[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deepthresh-quantization_precision_fallback_signature_match"
version = "0.1.0"
description = "通过字符级与结构级特征识别多模态算法研究员·量化位宽与精度回退的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "deepthresh" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://deepthresh.github.io"
Repository = "https://github.com/deepthresh/quantization_precision_fallback_signature_match"
Issues = "https://github.com/deepthresh/quantization_precision_fallback_signature_match/issues"

[project.scripts]
quantization_precision_fallback_signature_match = "quantization_precision_fallback_signature_match:main"

[tool.setuptools]
py-modules = ["quantization_precision_fallback_signature_match"]
